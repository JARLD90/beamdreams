<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beam Dreams — Send Feedback</title>
<meta name="description" content="Send feedback on the Beam Dreams beta.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--black:#141414;--purple:#7c3aed;--violet:#a78bfa;--blue:#2e8bff;--cyan:#00f5b8;--ink:#f7f6f3;--dim:#aeaeb2;--line:#2c2c2e;--panel:#1c1c1e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--ink);min-height:100vh;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:56px 24px}
  .card{max-width:520px;width:100%}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:30px}
  .top img{width:46px;height:46px;border-radius:12px}
  .top a{margin-left:auto;font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--dim);text-decoration:none}
  .top a:hover{color:var(--cyan)}
  .eyebrow{font-family:'Spline Sans Mono',monospace;font-size:13px;letter-spacing:4px;text-transform:uppercase;margin-bottom:14px}
  h1{font-weight:900;font-size:clamp(32px,8vw,46px);line-height:1;letter-spacing:-1.2px;margin-bottom:14px}
  p.lede{font-size:16px;color:var(--dim);margin-bottom:30px;line-height:1.55}
  label{display:block;font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--ink);text-transform:uppercase;margin:0 0 8px}
  .field{margin-bottom:22px}
  input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:'Archivo';font-size:15px;padding:13px 15px;border-radius:9px}
  select{appearance:none;-webkit-appearance:none}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan)}
  textarea{resize:vertical;min-height:140px}
  .btn{font-family:'Archivo';font-weight:700;font-size:16px;border:none;cursor:pointer;width:100%;background:var(--purple);color:#fff;padding:16px;border-radius:9px;transition:.18s;margin-top:4px}
  .btn:hover{background:#8b5cf6}
  .btn:disabled{opacity:.45;cursor:default}
  .status{font-family:'Spline Sans Mono',monospace;font-size:13px;margin-top:16px;text-align:center;min-height:18px}
  .drop{display:block;padding:44px 24px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;color:var(--dim);cursor:pointer;transition:.18s;background:var(--panel)}
  .drop:hover,.drop.over{border-color:var(--cyan);color:var(--ink)}
  .drop .big{font-size:17px;color:var(--ink);font-weight:700;margin-bottom:6px}
  .drop .sub{font-size:13px} .drop b{color:var(--cyan);font-weight:500} .drop input{display:none}
  #fileList{margin-top:16px;text-align:left}
  .item{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--blue);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
  .item .x{color:var(--dim);cursor:pointer;font-size:16px;line-height:1} .item .x:hover{color:var(--violet)}
  .small{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--dim);text-align:center;margin-top:24px;letter-spacing:.5px}
  .small a{text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><img src="logo.png" alt="Beam Dreams"><a href="/beta/">&larr; Back</a></div>
    <div class="eyebrow" style="color:var(--blue)">Beta feedback</div>
    <h1>Send feedback.</h1>
    <p class="lede">An idea, a request, a rule I got wrong, or just how it's working for you? Drop it here — it comes straight to my inbox.</p>

    <form id="fbForm" action="https://formspree.io/f/xgaogpja" method="POST">
      <input type="hidden" name="_next" value="https://beamdreams.art/beta/thanks">
      <div class="field"><label for="email">Your email</label><input type="email" id="email" name="email" placeholder="you@lasercompany.com" required></div>
      <div class="field"><label for="area">About</label>
        <select id="area" name="area" required>
          <option value="">Pick one</option>
          <option>Inventory</option><option>Shows / placements / zones</option><option>iPhone app / field use</option>
          <option>Checklists / evidence</option><option>Deadlines / reminders</option><option>Paperwork / forms</option>
          <option>Calculator</option><option>A rule or regulation</option><option>Something else</option>
        </select></div>
      <div class="field"><label for="subject">Subject</label><input type="text" id="subject" name="subject" placeholder="A few words" required></div>
      <div class="field"><label for="comment">Comment</label><textarea id="comment" name="comment" placeholder="Tell me what's on your mind." required></textarea></div>
      <button type="submit" class="btn" id="submit" disabled>Send feedback</button>
      <p class="status" id="status"></p>
    </form>
    <p class="small">Hit a bug instead? <a href="/beta/report" style="color:var(--violet)">Report it &rarr;</a></p>
  </div>
<script>
  var form=document.getElementById('fbForm'),status=document.getElementById('status'),btn=document.getElementById('submit');
  function syncBtn(){btn.disabled=!form.checkValidity();}
  form.addEventListener('input',syncBtn);form.addEventListener('change',syncBtn);syncBtn();
  form.addEventListener('submit',function(){btn.disabled=true;status.style.color='var(--dim)';status.textContent='Sending…';});
</script>
</body>
</html>
